# Render blueprint for the FastAPI service.
# Repo root is the heatfair/ directory, so the service root is backend/.
# Set DATABASE_URL to your Supabase connection string in the Render dashboard if you
# want durable data; the default SQLite file is ephemeral and reseeds on restart.
services:
  - type: web
    name: heatfair-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      # Only this project's own Freebuff Sites origins, not every tenant.
      - key: CORS_ORIGIN_REGEX_PATTERN
        value: "https://heatfair-[a-z0-9-]+\\.freebuff\\.site"
      - key: DOCS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTO_SEED_DEMO
        value: "true"
      # First owner account for the hosted demo. Set the Google address in the
      # dashboard; without it the deployed database has no accounts and nobody
      # can sign in. No password is needed, because sign-in happens with Google.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      # Optional local-development password for that account; Google sign-in
      # never uses it.
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Google OAuth client from Google Cloud Console. The authorised redirect
      # URI must be <this service>/api/v1/auth/google/callback.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Frontend origin to return to after Google sign-in.
      - key: FRONTEND_URL
        sync: false
